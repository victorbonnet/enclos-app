[versions]
androidGradlePlugin = "9.5.1"
# The NDK that compiles the Rust core (scripts/build-core-android.sh, CI)
ndk = "30.0.16248370"
kotlin = "2.4.21"
androidx-compose-bom = "2026.09.00"
androidx-activity-compose = "1.13.0"
jna = "5.19.1"
okhttp = "5.5.1"
zxing-android-embedded = "4.3.0"
androidx-lifecycle = "2.11.0"
androidx-browser = "1.10.0"
androidx-pdf = "1.0.0-beta01"
commonmark = "0.32.0"
firebase-messaging = "26.0.2"
androidx-fragment = "1.9.1"
junit = "4.13.2"
json = "20260814"
androidx-test-runner = "1.7.0"
androidx-test-ext-junit = "1.3.0"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
# Browser-owned tabs for HTTP(S) links the person chooses to open
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
# Native PDF view and its isolated, permission-free document renderer
androidx-pdf-viewer = { module = "androidx.pdf:pdf-viewer", version.ref = "androidx-pdf" }
androidx-pdf-document-service = { module = "androidx.pdf:pdf-document-service", version.ref = "androidx-pdf" }
# The WebSocket to each host's bridge
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Scanning the pairing QR code
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-android-embedded" }
# UniFFI's Kotlin bindings call the Rust core through JNA
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# Reading the agents' markdown (CommonMark, with GitHub's tables, strikethrough
# and bare links); the app draws it itself: no HTML, nothing fetched
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-ext-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
# Pushes from each host's bridge (docs/adr/0010): the token and the data
# messages; no other Firebase product
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
# Firebase's Play services libraries ask for Fragment 1.1, older than the
# activity result APIs the app uses (the app lock's prompt, the notification
# permission); named here so one recent enough is used
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
# Unit tests on the JVM, for what needs no phone
junit = { module = "junit:junit", version.ref = "junit" }
# org.json for those tests: android.jar's copy is a stub off the phone
json = { module = "org.json:json", version.ref = "json" }
# Instrumented tests, on a phone or an emulator, for what needs Android itself (SQLite)
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
