[versions]
androidGradlePlugin = "9.5.0"
kotlin = "2.4.21"
androidx-compose-bom = "2026.09.00"
androidx-activity-compose = "1.13.0"
jna = "5.19.1"
okhttp = "5.5.1"
zxing-android-embedded = "4.3.0"
androidx-lifecycle = "2.11.0"
androidx-browser = "1.10.0"
androidx-pdf = "1.0.0-beta01"
commonmark = "0.32.0"
junit = "4.13.2"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
# Browser-owned tabs for HTTP(S) links the person chooses to open
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
# Native PDF view and its isolated, permission-free document renderer
androidx-pdf-viewer = { module = "androidx.pdf:pdf-viewer", version.ref = "androidx-pdf" }
androidx-pdf-document-service = { module = "androidx.pdf:pdf-document-service", version.ref = "androidx-pdf" }
# The WebSocket to each host's bridge
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Scanning the pairing QR code
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxing-android-embedded" }
# UniFFI's Kotlin bindings call the Rust core through JNA
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
# Reading the agents' markdown (CommonMark, with GitHub's tables, strikethrough
# and bare links); the app draws it itself: no HTML, nothing fetched
commonmark = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-ext-gfm-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-ext-gfm-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-ext-autolink = { module = "org.commonmark:commonmark-ext-autolink", version.ref = "commonmark" }
# Unit tests on the JVM, for what needs no phone
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
