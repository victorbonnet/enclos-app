name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the toolchain, components and targets pinned in rust-toolchain.toml
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      # The binding generator: a workspace of its own (see its deny.toml)
      - run: cargo fmt --manifest-path tools/uniffi-bindgen/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/uniffi-bindgen/Cargo.toml --all-targets -- -D warnings
      - name: The generator and the app use the same uniffi
        run: sh scripts/check-uniffi-versions.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk --version 4.1.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Also checks that gradle-wrapper.jar is one Gradle published
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # The runner's own Android SDK and NDK
      - name: Build the Rust core and its Kotlin bindings
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" sh scripts/build-core-android.sh
      # The project's one debug signing key (docs/adr/0004), so this APK
      # installs over any other build. Runs without the secret (Dependabot's,
      # a fork's) sign with a throwaway key, and say so.
      - name: Put the shared debug signing key in place
        env:
          KEYSTORE: ${{ secrets.ENCLOS_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::No ENCLOS_DEBUG_KEYSTORE_B64 secret: this APK is signed with a throwaway key and installs only after uninstalling the app"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/enclos-debug.keystore"
          echo "ENCLOS_DEBUG_KEYSTORE=$RUNNER_TEMP/enclos-debug.keystore" >> "$GITHUB_ENV"
      - name: Build, test and lint the app
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      # A debug build to install on a phone or an emulator, to try a PR
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enclos-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # What ships in the app: no exception
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The binding generator, a build tool, with its one documented exception
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # cargo-deny reads the deny.toml next to this manifest
          manifest-path: tools/uniffi-bindgen/Cargo.toml

  ci-ok:
    if: always()
    needs: [rust, android, secrets, deny]
    runs-on: ubuntu-latest
    steps:
      - name: Check needed jobs
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo "All required jobs passed"
