# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check dependencies that are built for the platforms the app and its
# tools run on: the Android ABIs it ships, and the hosts that build it.
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
# The features the app is built with, not every feature of every dependency:
# `uniffi`'s optional binding generator (and the unmaintained crate it pulls
# in) is never built into the app. The generator is checked on its own, in
# tools/uniffi-bindgen/deny.toml.
all-features = false

[advisories]
# Vulnerabilities and unmaintained crates are denied by default, with no
# exception for what ships in the app
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with MIT, as in enclos, plus MPL-2.0 for
# UniFFI (file-level copyleft: using its crates unmodified keeps the app MIT).
# Ask before adding to this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# enclos-protocol, pinned to a commit of the enclos repository until it is
# published on crates.io (see CLAUDE.md)
allow-git = ["https://github.com/victorbonnet/enclos"]
