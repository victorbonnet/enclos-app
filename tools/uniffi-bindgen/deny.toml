# cargo-deny configuration for the binding generator, a build tool that never
# ships in the app: https://embarkstudios.github.io/cargo-deny/

[graph]
# The hosts that run this build tool. It never ships in the app.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# Vulnerabilities and unmaintained crates are denied by default. One exception,
# for this build tool only (the app's own deny.toml has none): remove it once
# a uniffi release no longer pulls basic-toml (Dependabot proposes uniffi
# updates weekly).
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0374", reason = "basic-toml is unmaintained (not a vulnerability); uniffi_bindgen pulls it through askama's `config` feature, and no uniffi or askama release drops it yet" },
]

[licenses]
# Permissive licenses compatible with MIT, as in enclos, plus MPL-2.0 for
# UniFFI (file-level copyleft: using its crates unmodified keeps the app MIT).
# Ask before adding to this list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
